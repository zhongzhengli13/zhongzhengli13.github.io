    <!-- Mathematics (loaded on demand when math content is detected) -->
    <script>
        (() => {
            let loading;
            let typesetting = Promise.resolve();
            window.loadMathJax = function(root = document.body) {
                if (!loading) {
                    window.MathJax = {
                        tex: {
                            inlineMath: [['$', '$'], ['\\(', '\\)']],
                            displayMath: [['$$', '$$'], ['\\[', '\\]']]
                        },
                        startup: { typeset: false }
                    };
                    loading = new Promise((resolve, reject) => {
                        const script = document.createElement('script');
                        script.src = 'https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js';
                        script.async = true;
                        script.onload = () => MathJax.startup.promise.then(resolve, reject);
                        script.onerror = () => {
                            script.remove();
                            loading = null;
                            reject(new Error('Unable to load math support'));
                        };
                        document.head.appendChild(script);
                    });
                }
                return loading.then(() => {
                    typesetting = typesetting.then(() => {
                        if (root.isConnected) return MathJax.typesetPromise([root]);
                    }).catch(error => console.error(error));
                    return typesetting;
                }).catch(error => console.error(error));
            };
        })();
    </script>
